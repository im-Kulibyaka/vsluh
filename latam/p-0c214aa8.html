<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<title>Пульт</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:#1f1a16;color:#ece5d3;font-family:system-ui,sans-serif;padding:24px 16px;display:flex;flex-direction:column;gap:14px}
h1{text-align:center;font-weight:500;font-size:20px;letter-spacing:.2em;color:#d8c08a;margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{border:2px solid #d8c08a;border-radius:20px;background:#2f3323;color:#ece5d3;font-size:20px;padding:0;height:140px;overflow:hidden;position:relative}
button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
button span{position:relative;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:10px}
button:active{transform:scale(.96)}
.hide{background:#7d1f24;height:110px;font-size:24px}
.snd{background:#5b6346;height:110px;font-size:24px}
#st{text-align:center;font-size:14px;opacity:.7;min-height:20px}
</style>
</head>
<body>
<h1>ПУЛЬТ</h1>
<div class="row">
<button data-c="show1"><img src="files/m1.jpg" alt=""><span>Фото 1</span></button>
<button data-c="show2"><img src="files/m2.jpg" alt=""><span>Фото 2</span></button>
</div>
<button class="snd" data-c="sound">🔊 Звук</button>
<button class="hide" data-c="hide">✕ Вернуть презентацию</button>
<div id="st">Перед показом один раз кликните по презентации, иначе звук может не включиться</div>
<script>
const T="latam-0c214aa88bb52bf0",st=document.getElementById('st');
document.querySelectorAll('button').forEach(b=>b.onclick=async()=>{
 st.textContent='Отправка…';
 try{const r=await fetch('https://ntfy.sh/'+T,{method:'POST',body:b.dataset.c});st.textContent=r.ok?'Отправлено: '+b.textContent.trim():'Ошибка '+r.status}
 catch(e){st.textContent='Нет связи'}
 if(navigator.vibrate)navigator.vibrate(30)});
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Забытый собор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Тёмная сцена в одном визуальном мире: холодный камень, лучи света. */
:root{ --bg:#07090c; --ink:#e7ecf2; --muted:#9aa6b2; --glass:rgba(12,15,20,.5); --line:rgba(220,230,245,.14);
  --serif:'Cormorant Garamond', Georgia, serif; --sans:Manrope, system-ui, sans-serif; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.title{position:fixed;left:calc(clamp(18px,3vw,48px) + env(safe-area-inset-left,0px));bottom:calc(clamp(18px,4vh,48px) + env(safe-area-inset-bottom,0px));pointer-events:none;
  transition:opacity 1s}
.title h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,4.4vw,78px);line-height:1;margin:0;letter-spacing:.01em;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.title p{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.5vw,26px);color:var(--muted);margin:.4em 0 0}
.ui{position:fixed;right:calc(clamp(14px,2vw,32px) + env(safe-area-inset-right,0px));bottom:calc(clamp(14px,3vh,36px) + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;padding:8px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.rbtn{width:clamp(58px,4.6vw,84px);height:clamp(58px,4.6vw,84px);border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);display:grid;place-items:center;transition:transform .15s}
.rbtn:active{transform:scale(.9)}
.rbtn svg{width:40%;height:40%}
.dots{display:flex}
.dot{width:36px;height:52px;border:0;background:none;display:grid;place-items:center;padding:0}
.dot i{width:10px;height:10px;border-radius:99px;background:var(--ink);opacity:.3;transition:all .35s}
.dot.on i{width:26px;opacity:.9}
.tr{position:fixed;top:calc(clamp(14px,2.5vh,32px) + env(safe-area-inset-top,0px));right:calc(clamp(14px,2vw,32px) + env(safe-area-inset-right,0px))}
.tr .rbtn{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hint{position:fixed;top:calc(clamp(14px,2.5vh,32px) + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:clamp(14px,1vw,19px);color:var(--muted);white-space:nowrap;transition:opacity .8s}
.hint.off{opacity:0}
#fade{position:fixed;inset:0;background:#000;display:grid;place-items:center;z-index:5;transition:opacity 1.6s ease}
#fade.off{opacity:0;pointer-events:none}
#fade div{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2vw,34px);color:var(--muted);text-align:center;padding:0 16px}
.hide .title,.hide .ui,.hide .tr{opacity:0;pointer-events:none}
@media (max-width:560px){ .hint{white-space:normal;width:calc(100% - 120px);left:16px;transform:none} }
@media (prefers-reduced-motion: reduce){ #fade{transition:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>Забытый собор</h1><p>Свет всё ещё приходит сюда каждое утро</p></div>
<div class="ui">
  <button class="rbtn" id="prev" aria-label="Предыдущий вид"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
  <div class="dots" id="dots"></div>
  <button class="rbtn" id="next" aria-label="Следующий вид"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg></button>
</div>
<div class="tr"><button class="rbtn" id="fs" aria-label="Во весь экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
<div class="hint off" id="hint">Ведите пальцем, чтобы осмотреться · двумя пальцами — приблизить</div>
<div id="fade"><div id="fadeMsg">Открываем двери…</div></div>

<script>window.addEventListener('error',()=>{ const m=document.getElementById('fadeMsg'); if (m) m.textContent='Не удалось загрузить 3D. Нужен интернет и браузер с WebGL.'; });</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const FAST=/[?&]fast/.test(location.search);
const V3=THREE.Vector3, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let seed=11; const rnd=(a=0,b=1)=>{ seed=(seed*16807)%2147483647; return a+(seed/2147483647)*(b-a); };

/* ---------- рендер ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
const maxPR=FAST?.6:Math.min(devicePixelRatio||1,1.5); let pr=maxPR;
renderer.setPixelRatio(pr); renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.3;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const ANISO=renderer.capabilities.getMaxAnisotropy();
const scene=new THREE.Scene(); scene.background=new THREE.Color('#06080b');
scene.fog=new THREE.FogExp2('#0f141a', .018);
const camera=new THREE.PerspectiveCamera(52, innerWidth/innerHeight, .05, 200);

// 1) сцена → sceneRT (с глубиной); 2) объёмный свет → volRT (½ разрешения) → размытие; 3) композит → свечение → тонмаппинг → цвет
const sceneRT=new THREE.WebGLRenderTarget(16,16,{ type:THREE.HalfFloatType, samples:FAST?0:4 });
sceneRT.depthTexture=new THREE.DepthTexture(16,16); sceneRT.depthTexture.type=THREE.FloatType;
const volA=new THREE.WebGLRenderTarget(16,16,{ type:THREE.HalfFloatType }), volB=volA.clone();
const lightCam=new THREE.OrthographicCamera(-24,24,24,-24,1,110);
const lightRT=new THREE.WebGLRenderTarget(FAST?512:1024,FAST?512:1024,{ type:THREE.FloatType });
lightRT.depthTexture=new THREE.DepthTexture(lightRT.width,lightRT.height); lightRT.depthTexture.type=THREE.FloatType;
const fsq=new THREE.Mesh(new THREE.PlaneGeometry(2,2)); const fsScene=new THREE.Scene(); fsScene.add(fsq); const fsCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const quadVS=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`;
const volMat=new THREE.ShaderMaterial({ vertexShader:quadVS,
  uniforms:{ tDepth:{value:sceneRT.depthTexture}, tLight:{value:lightRT.depthTexture}, invProj:{value:new THREE.Matrix4()}, camWorld:{value:new THREE.Matrix4()},
    lightVP:{value:new THREE.Matrix4()}, camPos:{value:new V3()}, sunW:{value:new V3(0,1,0)}, time:{value:0}, res:{value:new THREE.Vector2(1,1)},
    steps:{value:FAST?28:56}, dens:{value:.062}, lcol:{value:new THREE.Color('#c7d8f5')} },
  fragmentShader:`uniform sampler2D tDepth, tLight; uniform mat4 invProj, camWorld, lightVP; uniform vec3 camPos, sunW, lcol; uniform float time, steps, dens; uniform vec2 res; varying vec2 vUv;
    float h3(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
      return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
    void main(){
      float d=texture2D(tDepth,vUv).x;
      vec4 v=invProj*vec4(vUv*2.-1., d*2.-1., 1.); v/=v.w; vec3 P=(camWorld*v).xyz;
      vec3 R=P-camPos; float len=length(R); float L=min(len,46.); vec3 dir=R/max(len,1e-4);
      float jit=fract(52.9829189*fract(dot(gl_FragCoord.xy,vec2(.06711056,.00583715))));   // шум с равномерным распределением
      float sl=L/steps, acc=0.;
      for (int i=0;i<96;i++){ if (float(i)>=steps) break;
        vec3 X=camPos+dir*(float(i)+jit)*sl;
        vec4 lp=lightVP*vec4(X,1.); vec3 q=lp.xyz/lp.w*.5+.5;
        if (q.x>0.&&q.x<1.&&q.y>0.&&q.y<1.&&q.z<=texture2D(tLight,q.xy).x+.0015){
          float n=vn(X*.55+vec3(time*.04,time*.07,time*.03))*.65+vn(X*1.6-vec3(0.,time*.1,0.))*.35;
          acc+=(.35+n)*smoothstep(-.5,2.5,X.y); } }
      acc*=sl*dens;
      float mu=dot(dir,sunW), g=.62, ph=(1.-g*g)/pow(1.+g*g-2.*g*mu,1.5);
      gl_FragColor=vec4(lcol*acc*(.25+ph*.35),1.); }` });
const blurMat=new THREE.ShaderMaterial({ vertexShader:quadVS, uniforms:{ tex:{value:null}, dirv:{value:new THREE.Vector2()} },
  fragmentShader:`uniform sampler2D tex; uniform vec2 dirv; varying vec2 vUv;
    void main(){ vec3 c=texture2D(tex,vUv).rgb*.227; c+=(texture2D(tex,vUv+dirv*1.385).rgb+texture2D(tex,vUv-dirv*1.385).rgb)*.316; c+=(texture2D(tex,vUv+dirv*3.23).rgb+texture2D(tex,vUv-dirv*3.23).rgb)*.07; gl_FragColor=vec4(c,1.); }` });
function fs(mat, target){ fsq.material=mat; renderer.setRenderTarget(target); renderer.render(fsScene, fsCam); }
const composer=new EffectComposer(renderer, new THREE.WebGLRenderTarget(16,16,{ type:THREE.HalfFloatType }));
const comp=new ShaderPass({ uniforms:{ tDiffuse:{value:null}, tScene:{value:sceneRT.texture}, tVol:{value:volA.texture} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform sampler2D tScene, tVol; varying vec2 vUv; void main(){ gl_FragColor=vec4(texture2D(tScene,vUv).rgb+texture2D(tVol,vUv).rgb,1.); }` });
comp.uniforms.tScene.value=sceneRT.texture; comp.uniforms.tVol.value=volA.texture;
composer.addPass(comp);
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), .45, .6, .9); composer.addPass(bloom);
composer.addPass(new OutputPass());
const vol={ uniforms:volMat.uniforms };
const grade=new ShaderPass({ uniforms:{ tDiffuse:{value:null}, time:{value:0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
    void main(){ vec3 c=texture2D(tDiffuse,vUv).rgb;
      float l=dot(c,vec3(.299,.587,.114));
      c=mix(vec3(l),c,.78);                                   // приглушённые цвета
      c=mix(c*vec3(.86,.97,1.1), c, smoothstep(.0,.55,l));    // холод в тенях
      c=(c-.5)*1.06+.5;
      vec2 d=vUv-.5; c*=1.-dot(d,d)*1.25;                     // виньетка
      float n=fract(sin(dot(vUv*vec2(1271.3,917.7)+fract(time*.7),vec2(12.9898,78.233)))*43758.5453);
      c+=(n-.5)*.045;                                          // зерно
      gl_FragColor=vec4(max(c,0.),1.); }` });
composer.addPass(grade);
function resize(){ renderer.setPixelRatio(pr); renderer.setSize(innerWidth,innerHeight); composer.setPixelRatio(pr); composer.setSize(innerWidth,innerHeight);
  const W=Math.round(innerWidth*pr), H=Math.round(innerHeight*pr); sceneRT.setSize(W,H); volA.setSize(W>>1,H>>1); volB.setSize(W>>1,H>>1);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize);

/* ---------- текстуры (Poly Haven, CC0) ---------- */
const TL=new THREE.TextureLoader(); let loaded=0, total=0;
const progress=()=>{ document.getElementById('fadeMsg').textContent=`Открываем двери… ${Math.round(loaded/Math.max(1,total)*100)}%`; };
const tex=(url,srgb,rep=1)=>{ total++; const t=TL.load(url,()=>{ loaded++; progress(); },undefined,()=>{ loaded++; progress(); });
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep,rep); t.anisotropy=ANISO; if (srgb) t.colorSpace=THREE.SRGBColorSpace; return t; };
function pbr(name, rep, o={}){
  const arm=tex(`tex/${name}_arm.jpg`,false,rep);
  return new THREE.MeshStandardMaterial({ map:tex(`tex/${name}.jpg`,true,rep), normalMap:tex(`tex/${name}_n.jpg`,false,rep), roughnessMap:arm, aoMap:arm, aoMapIntensity:.85,
    roughness:1, metalness:0, color:o.color||'#ffffff', normalScale:new THREE.Vector2(o.n??1.2,o.n??1.2), envMapIntensity:o.env??1 });
}
const M={
  wall:pbr('plastered_stone_wall',.28,{color:'#aab3bb'}),
  stone:pbr('castle_wall_varriation',.35,{color:'#8d949a'}),
  floor:pbr('old_wood_floor',.42,{color:'#a9a49c'}),
  wood:pbr('weathered_planks',.6,{color:'#8b7f73'}),
  dark:new THREE.MeshStandardMaterial({ color:'#16181c', roughness:.9 }),
  armor:new THREE.MeshStandardMaterial({ color:'#2c2e33', roughness:.5, metalness:.55 }),
  paper:new THREE.MeshStandardMaterial({ color:'#cfc6b2', roughness:.95, side:THREE.DoubleSide }),
  glass:new THREE.MeshBasicMaterial({ color:new THREE.Color('#e9f2ff').multiplyScalar(4.5) }),
};
// UV по размерам в метрах (для коробок любого размера)
function boxUV(g, s=1){ const p=g.attributes.position, n=g.attributes.normal, uv=g.attributes.uv;
  for (let i=0;i<p.count;i++){ const ax=Math.abs(n.getX(i)), ay=Math.abs(n.getY(i)), az=Math.abs(n.getZ(i)), x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    if (ax>ay&&ax>az) uv.setXY(i,z*s,y*s); else if (ay>az) uv.setXY(i,x*s,z*s); else uv.setXY(i,x*s,y*s); } return g; }
const add=(m,cast=true,recv=true)=>{ m.castShadow=cast; m.receiveShadow=recv; scene.add(m); return m; };
const box=(w,h,d,mat,x,y,z,rx=0,ry=0,rz=0,s=1)=>{ const m=new THREE.Mesh(boxUV(new THREE.BoxGeometry(w,h,d),s),mat); m.position.set(x,y,z); m.rotation.set(rx,ry,rz); return add(m); };

/* ---------- архитектура ---------- */
const HW=8, HL=14, HH=22, T=1.4;
function lancet(cx,y0,w,h){ const s=new THREE.Path(), ys=y0+h-w*.866;
  s.moveTo(cx-w/2,y0); s.lineTo(cx+w/2,y0); s.lineTo(cx+w/2,ys); s.absarc(cx-w/2,ys,w,0,Math.PI/3,false); s.absarc(cx+w/2,ys,w,Math.PI*2/3,Math.PI,false); s.lineTo(cx-w/2,y0); return s; }
function wall(width, height, holes, mat){ const sh=new THREE.Shape(); sh.moveTo(-width/2,0); sh.lineTo(width/2,0); sh.lineTo(width/2,height); sh.lineTo(-width/2,height); sh.lineTo(-width/2,0);
  holes.forEach(h=>sh.holes.push(h)); const g=new THREE.ExtrudeGeometry(sh,{ depth:T, bevelEnabled:false, curveSegments:24 }); g.translate(0,0,-T/2); return new THREE.Mesh(g,mat); }
const WIN=[ {cx:0,y0:8.6,w:2.7,h:9.4}, {cx:-4.3,y0:9.6,w:1.9,h:7.2}, {cx:4.3,y0:9.6,w:1.9,h:7.2} ];
const back=wall(HW*2+2*T, HH, WIN.map(w=>lancet(w.cx,w.y0,w.w,w.h)), M.wall); back.position.set(0,0,-HL-T/2); add(back);
const SIDEWIN={cx:-6,y0:8.4,w:2.1,h:8};   // окно в правой стене (координата вдоль стены)
const right=wall(HL*2, HH, [lancet(SIDEWIN.cx,SIDEWIN.y0,SIDEWIN.w,SIDEWIN.h)], M.wall); right.rotation.y=-Math.PI/2; right.position.set(HW+T/2,0,0); add(right);
const left=wall(HL*2, HH, [], M.wall); left.rotation.y=Math.PI/2; left.position.set(-HW-T/2,0,0); add(left);
const front=wall(HW*2+2*T, HH, [], M.wall); front.position.set(0,0,HL+T/2); add(front);
box(HW*2+3,1.2,HL*2+3,M.dark,0,HH+.6,0);                                                   // свод (в тени)
for (let z=-12;z<=12;z+=4) box(HW*2,.7,.5,M.wood,0,HH-.6,z,0,0,0,.5);                       // балки
const fl=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,HL*2), M.floor); fl.rotation.x=-Math.PI/2;
fl.geometry.attributes.uv.array.forEach((v,i,a)=>{ a[i]=v*(i%2?HL*2:HW*2); }); add(fl,false,true);
// колонны с кольцами
const colGeo=mergeGeometries([ new THREE.CylinderGeometry(.72,.72,HH,40,1,true), ...[.5,6.5,12.5,18].map(y=>{ const t=new THREE.TorusGeometry(.76,.12,10,40); t.rotateX(Math.PI/2); t.translate(0,y-HH/2,0); return t; }),
  (()=>{ const b=new THREE.CylinderGeometry(.95,1.05,.8,40); b.translate(0,-HH/2+.4,0); return b; })() ]);
colGeo.attributes.uv.array.forEach((v,i,a)=>{ a[i]=v*(i%2?HH*.5:2.2); });
[[-6.6,-9.5],[-6.6,-2.5],[-6.6,4.5],[-6.6,11.5],[6.6,-9.5],[6.6,-2.5],[6.6,4.5],[6.6,11.5]].forEach(([x,z])=>{ const c=new THREE.Mesh(colGeo,M.wall); c.position.set(x,HH/2,z); add(c); });
// стрельчатый портал в левой стене
(()=>{ const outer=lancet(0,0,3.6,6.4), inner=lancet(0,0,2.8,5.8); const sh=new THREE.Shape(outer.getPoints(40)); sh.holes.push(new THREE.Path(inner.getPoints(40)));
  const g=new THREE.ExtrudeGeometry(sh,{depth:.5,bevelEnabled:true,bevelSize:.06,bevelThickness:.06,bevelSegments:2}); const m=new THREE.Mesh(g,M.stone);
  m.rotation.y=Math.PI/2; m.position.set(-HW+.05,0,3.6); add(m);
  const door=new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(inner.getPoints(40))), new THREE.MeshStandardMaterial({ color:'#0b0c0e', roughness:1 })); door.rotation.y=Math.PI/2; door.position.set(-HW+.02,0,3.6); add(door);
  // ажурный трилистник над дверью
  for (let k=0;k<3;k++){ const t=new THREE.Mesh(new THREE.TorusGeometry(.42,.07,8,32),M.stone); const a=k/3*Math.PI*2+Math.PI/2; t.rotation.y=Math.PI/2; t.position.set(-HW+.3,4.6+Math.sin(a)*.42,3.6+Math.cos(a)*.42); add(t); }
})();
// окна: свечение стекла и переплёты (переплёты отбрасывают тени-решётки на пол)
const glassGeo=(w)=>new THREE.ShapeGeometry(new THREE.Shape(lancet(w.cx,w.y0,w.w,w.h).getPoints(30)));
WIN.forEach(w=>{ const g=new THREE.Mesh(glassGeo(w),M.glass); g.position.z=-HL-T-.05; scene.add(g);
  for (let y=w.y0+1.1;y<w.y0+w.h-w.w*.6;y+=1.1) box(w.w,.07,.12,M.dark,w.cx,y,-HL-T*.5);
  for (let k=1;k<3;k++) box(.07,w.h,.12,M.dark,w.cx-w.w/2+k*w.w/3,w.y0+w.h/2,-HL-T*.5); });
{ const g=new THREE.Mesh(glassGeo(SIDEWIN),M.glass); g.rotation.y=-Math.PI/2; g.position.x=HW+T+.05; scene.add(g);
  for (let y=SIDEWIN.y0+1.2;y<SIDEWIN.y0+SIDEWIN.h-1.4;y+=1.2) box(.12,.07,SIDEWIN.w,M.dark,HW+T*.5,y,SIDEWIN.cx); }

  if (fly){ fly.t+=dt/fly.dur; const k=easeIO(Math.min(1,fly.t)); cp.lerpVectors(fly.p0,fly.v.pos,k); cl.lerpVectors(fly.l0,fly.v.look,k); cf=fly.f0+(fly.v.fov-fly.f0)*k; if (fly.t>=1) fly=null; }
  if (!dragging){ yawO*=1-Math.min(1,dt*.25); pitO*=1-Math.min(1,dt*.25); }
  fwd.subVectors(cl,cp).normalize(); const yaw=Math.atan2(fwd.x,-fwd.z)+yawO+Math.sin(t*.07)*.035, pit=Math.asin(clamp(fwd.y,-1,1))+pitO+Math.sin(t*.05)*.015;
  camera.position.set(cp.x+Math.sin(t*.11)*.12, cp.y+Math.sin(t*.09)*.05, cp.z+Math.cos(t*.08)*.1);
  camera.lookAt(tmp.copy(camera.position).add(fwd.set(Math.sin(yaw)*Math.cos(pit),Math.sin(pit),-Math.cos(yaw)*Math.cos(pit))));
  const f=cf*fovK; if (Math.abs(camera.fov-f)>.01){ camera.fov+=(f-camera.fov)*Math.min(1,dt*6); camera.updateProjectionMatrix(); }
}
let fpsN=0, fpsT=0, low=false;
function adapt(dt){ if (FAST) return; fpsN++; fpsT+=dt; if (fpsT<2.5) return; const fps=fpsN/fpsT; fpsN=fpsT=0;
  if (fps<32){ if (pr>.8){ pr=Math.max(.8,pr-.2); resize(); } else if (!low){ low=true; vol.uniforms.steps.value=32; } }
  else if (fps>57&&pr<maxPR){ pr=Math.min(maxPR,pr+.1); resize(); } }

resize();
window.__state=()=>({ view, flying:!!fly, loaded, total });
window.__view=i=>{ go(i); if (FAST) fly.dur=.01; };
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),1/20), t=clock.elapsedTime;
  shaftMat.uniforms.time.value=t; dust.uniforms.time.value=t; grade.uniforms.time.value=t; dust.uniforms.pxr.value=pr;
  hang.forEach(h=>{ h.rotation.z=.08+Math.sin(t*.35)*.012; h.rotation.x=.06+Math.sin(t*.27)*.01; });
  updateCamera(dt,t); adapt(dt);
  if (lightDirty) renderLightDepth();
  camera.updateMatrixWorld(); vol.uniforms.invProj.value.copy(camera.projectionMatrixInverse); vol.uniforms.camWorld.value.copy(camera.matrixWorld);
  vol.uniforms.camPos.value.copy(camera.position); vol.uniforms.time.value=t; 
  renderer.setRenderTarget(sceneRT); renderer.render(scene,camera);
  fs(volMat, volA);
  for (let k=0;k<2;k++){ blurMat.uniforms.tex.value=volA.texture; blurMat.uniforms.dirv.value.set(1/volA.width,0); fs(blurMat, volB);
    blurMat.uniforms.tex.value=volB.texture; blurMat.uniforms.dirv.value.set(0,1/volA.height); fs(blurMat, volA); }
  renderer.setRenderTarget(null);
  composer.render();
});
const ready=()=>{ document.getElementById('fade').classList.add('off'); setTimeout(()=>document.getElementById('hint').classList.remove('off'),1800); setTimeout(()=>document.getElementById('hint').classList.add('off'),8000); };
const waitAll=()=>{ if (loaded>=total) setTimeout(ready,400); else setTimeout(waitAll,200); }; waitAll();
setTimeout(ready, 15000);
</script>

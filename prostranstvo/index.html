<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Невозможные места</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eef4; --ink:#17161d; --muted:#4f4d5c; --glass:rgba(255,255,255,.62); --line:rgba(20,20,40,.12);
  --accent:#17161d; --accent-ink:#ffffff; --shadow:0 24px 70px rgba(30,40,70,.22);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141419; --ink:#f3f2f8; --muted:#c3c1d0; --glass:rgba(22,22,30,.62); --line:rgba(255,255,255,.14);
  --accent:#f3f2f8; --accent-ink:#141419; --shadow:0 24px 70px rgba(0,0,0,.4); } }
:root[data-theme="dark"]{ --bg:#141419; --ink:#f3f2f8; --muted:#c3c1d0; --glass:rgba(22,22,30,.62); --line:rgba(255,255,255,.14);
  --accent:#f3f2f8; --accent-ink:#141419; --shadow:0 24px 70px rgba(0,0,0,.4); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,a{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;text-decoration:none}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:var(--shadow)}

.card{position:fixed;left:clamp(16px,3vw,56px);top:50%;transform:translateY(-50%);width:min(32vw,560px);
  padding:clamp(20px,2.2vw,40px);border-radius:30px;transition:opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1)}
.card.out{opacity:0;transform:translateY(-50%) translateX(-28px);pointer-events:none}
.thumb{display:block;width:100%;height:clamp(110px,13vw,220px);border-radius:18px;overflow:hidden;margin-bottom:clamp(14px,1.4vw,24px);
  padding:0;border:0;position:relative;background:#0002}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;right:10px;bottom:10px;font-size:clamp(12px,.85vw,15px);font-weight:700;padding:.4em .8em;border-radius:999px;background:rgba(0,0,0,.55);color:#fff}
.thumb[hidden]{display:none}
.num{font-family:Unbounded,sans-serif;font-weight:500;font-size:clamp(13px,.95vw,18px);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.card h1{font-family:Unbounded,sans-serif;font-weight:700;font-size:clamp(28px,2.7vw,54px);line-height:1.08;margin:.3em 0 .4em;text-wrap:balance;overflow-wrap:anywhere}
.card p{font-size:clamp(17px,1.3vw,24px);line-height:1.45;color:var(--muted);margin:0;text-wrap:pretty}
.action{margin-top:clamp(18px,1.8vw,30px);min-height:clamp(60px,5vw,84px);padding:0 1.7em;border-radius:999px;border:0;display:inline-flex;align-items:center;gap:.6em;
  font-weight:700;font-size:clamp(17px,1.3vw,24px);color:var(--accent-ink);background:var(--accent);transition:transform .15s}
.action:active{transform:scale(.95)}
.action[hidden]{display:none}

.nav{position:fixed;left:50%;bottom:calc(clamp(14px,3vh,36px) + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;align-items:center;gap:clamp(8px,1vw,18px);padding:10px;border-radius:999px}
.rbtn{width:clamp(66px,5.4vw,96px);height:clamp(66px,5.4vw,96px);border-radius:50%;border:1px solid var(--line);
  background:rgba(127,127,140,.12);display:grid;place-items:center;transition:transform .15s, opacity .2s}
.rbtn:active{transform:scale(.9)}
.rbtn:disabled{opacity:.3}
.rbtn svg{width:42%;height:42%}
.dots{display:flex}
.dot{width:clamp(36px,2.8vw,54px);height:clamp(54px,4.4vw,80px);border:0;background:none;display:grid;place-items:center;padding:0}
.dot i{display:block;width:13px;height:13px;border-radius:999px;background:currentColor;opacity:.3;transition:all .35s}
.dot.on i{width:clamp(28px,2.2vw,40px);opacity:1}
.tl,.tr{position:fixed;top:calc(clamp(14px,2.5vh,32px) + env(safe-area-inset-top));display:flex;gap:12px}
.tl{left:clamp(14px,2vw,32px)} .tr{right:clamp(14px,2vw,32px)}
.pill{height:clamp(60px,4.6vw,84px);padding:0 1.4em 0 1.1em;border-radius:999px;display:flex;align-items:center;gap:.6em;font-weight:700;font-size:clamp(16px,1.2vw,22px)}
.pill svg{width:1.5em;height:1.5em}
.pill[hidden]{display:none}
.tr .rbtn{width:clamp(60px,4.6vw,84px);height:clamp(60px,4.6vw,84px)}

.hint{position:fixed;bottom:calc(clamp(110px,14vh,160px) + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:999px;
  font-size:clamp(15px,1.1vw,21px);white-space:nowrap;transition:opacity .6s, transform .6s}
.hint.off{opacity:0;transform:translateX(-50%) translateY(20px);pointer-events:none}

#fade{position:fixed;inset:0;background:#f4f6f9;opacity:1;pointer-events:none;transition:opacity .6s ease;z-index:8;display:grid;place-items:center}
#fade div{font-family:Unbounded,sans-serif;font-size:clamp(18px,2vw,32px);color:#17161d;opacity:.7;text-align:center;padding:0 16px}
#lightbox{position:fixed;inset:0;z-index:9;background:rgba(10,10,14,.88);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s}
#lightbox.on{opacity:1;pointer-events:auto}
#lightbox img{max-width:92vw;max-height:88vh;border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.5)}

@media (max-aspect-ratio: 1/1){
  .card{left:16px;right:16px;width:auto;top:auto;bottom:calc(clamp(96px,12vh,140px) + env(safe-area-inset-bottom));transform:none;padding:20px}
  .card.out{transform:translateY(24px)}
  .thumb{height:120px}
  .card h1{font-size:clamp(24px,6.5vw,42px)}
  .card p{font-size:clamp(15px,4vw,20px)}
  .hint{display:none}
}
@media (max-width:520px){ .dot{width:28px} .pill span{display:none} .pill{padding:0 1em} }

#bgphoto{position:fixed;inset:-80px;background-size:cover;background-position:center;filter:blur(60px) brightness(.62) saturate(1.3);opacity:0;transition:opacity .6s}
body.photo{background:#0d0d10}
body.photo #bgphoto{opacity:1}
body.photo .glass{background:rgba(18,18,24,.55);border-color:rgba(255,255,255,.14);color:#f3f2f8}
body.photo .card p,body.photo .num{color:#cfcde0}
body.photo .action{background:#f3f2f8;color:#141419}
body.photo #c{inset:auto;top:50%;right:clamp(16px,3.5vmin,48px);transform:translateY(-50%);border-radius:26px;box-shadow:0 40px 120px rgba(0,0,0,.55)}
@media (max-aspect-ratio:1/1){ body.photo #c{right:auto;left:50%;top:clamp(16px,3.5vmin,48px);transform:translateX(-50%)} }
</style>
</head>
<body>
<div id="bgphoto"></div>
<canvas id="c"></canvas>

<div class="card glass out" id="card">
  <button class="thumb" id="thumb" hidden aria-label="Открыть фото"><img id="thumbImg" alt=""><span>Фото</span></button>
  <div class="num" id="num"></div>
  <h1 id="title"></h1>
  <p id="text"></p>
  <button class="action" id="action" hidden></button>
</div>

<div class="nav glass">
  <button class="rbtn" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
  <div class="dots" id="dots"></div>
  <button class="rbtn" id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg></button>
</div>

<div class="tl"><button class="pill glass" id="home" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Хаб</span></button></div>
<div class="tr"><button class="rbtn glass" id="fs" aria-label="Во весь экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>

<div class="hint glass off" id="hint"></div>
<div id="lightbox"><img id="lbImg" alt=""></div>
<div id="fade"><div id="fadeMsg">Открываем пространство…</div></div>

<script>
  window.addEventListener('error', () => { const m=document.getElementById('fadeMsg'); if (m) m.textContent='Не удалось загрузить 3D. Нужен интернет и браузер с WebGL.'; });
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================
   МЕСТА И ТЕКСТЫ — меняйте здесь.
   Точки обзора: u — доля ширины фото слева, v — доля высоты снизу,
   zoom 0…1 — насколько камера влетает внутрь к этой точке.
   ===================================================================== */
const PLACES = [
  { title:'Небесный каркас', sub:'Колонны выше облаков держат над лугом бетонную решётку неба.', photo:'foto/1.jpg', depth:'foto/1_d.png', depthBg:'foto/1_db.png', vfov:62,
    stops:[
      { u:.5, v:.5, zoom:0, title:'Небесный каркас', text:'Колонны высотой с гору держат над лугом бетонную решётку. Сквозь окна в ней видно небо.' },
      { u:.5, v:.68, zoom:.6, title:'Лес колонн', text:'Между опорами можно гулять часами. Запрокиньте голову: каркас уходит за горизонт.' },
      { u:.5, v:.15, zoom:.75, title:'Масштаб', text:'Человек на лугу — точка. Всё остальное сделано для великанов.' } ] },
  { title:'Каменные кольца', sub:'Долина уходит сквозь череду арок, вырезанных в скале.', photo:'foto/2.jpg', depth:'foto/2_d.png', depthBg:'foto/2_db.png', vfov:56,
    stops:[
      { u:.5, v:.5, zoom:0, title:'Каменные кольца', text:'Тропа ведёт сквозь арки в скале. Каждая следующая меньше предыдущей.' },
      { u:.47, v:.6, zoom:.8, title:'Внутри тоннеля', text:'Слои известняка закручены кольцами, будто скала — срез огромного дерева.' },
      { u:.49, v:.1, zoom:.7, title:'Путник', text:'Маленькая фигура внизу помогает понять, насколько огромны кольца.' } ] },
  { title:'Монолиты', sub:'Над еловым лесом наклонились гладкие каменные плиты.', photo:'foto/3.jpg', depth:'foto/3_d.png', depthBg:'foto/3_db.png', vfov:56,
    stops:[
      { u:.5, v:.5, zoom:0, title:'Монолиты', text:'Над лесом наклонились гладкие плиты. Их никто не строил — они просто здесь.' },
      { u:.22, v:.62, zoom:.6, title:'Ближний гигант', text:'Каждый монолит выше любой горы вокруг.' },
      { u:.82, v:.4, zoom:.7, title:'У горизонта', text:'Дальние плиты тонут в дымке над хребтом.' } ] },
  { title:'Гора-колоннада', sub:'Склон срезан, как ножом, а на террасе стоит круг колонн.', photo:'foto/4.jpg', depth:'foto/4_d.png', depthBg:'foto/4_db.png', vfov:56,
    stops:[
      { u:.5, v:.5, zoom:0, title:'Гора-колоннада', text:'Склон горы срезан, как ножом, а на ровной террасе стоит круглая колоннада.' },
      { u:.5, v:.54, zoom:.8, title:'Колоннада', text:'Сорок колонн стоят по кругу на краю травяной террасы.' },
      { u:.42, v:.8, zoom:.7, title:'Лестница к вершине', text:'Узкие ступени прорезают скалу до самого верха.' } ] },
  { title:'Каменные клыки', sub:'Два острых камня наклонились над травяным холмом у моря.', photo:'foto/5.jpg', depth:'foto/5_d.png', depthBg:'foto/5_db.png', vfov:56,
    stops:[
      { u:.5, v:.5, zoom:0, title:'Каменные клыки', text:'Два острых камня наклонились над холмом, будто их вытолкнуло из земли.' },
      { u:.45, v:.78, zoom:.6, title:'Под остриём', text:'Вершина нависает над головой на высоте сотен метров.' },
      { u:.5, v:.1, zoom:.75, title:'Путник', text:'Рядом с камнем человек кажется муравьём.' } ] },
  { title:'Стена над водопадом', sub:'На краю обрыва стоит ребристая стена, а из-под неё падает вода.', photo:'foto/6.jpg', depth:'foto/6_d.png', depthBg:'foto/6_db.png', vfov:56,
    stops:[
      { u:.5, v:.5, zoom:0, title:'Стена над водопадом', text:'На краю обрыва стоит ребристая стена, а из-под неё в море падает водопад.' },
      { u:.37, v:.33, zoom:.75, title:'Водопад', text:'Вода срывается со скалы и рассыпается туманом.' },
      { u:.52, v:.7, zoom:.6, title:'Стена', text:'Стена выше зелёных гор вокруг. Что за ней — неизвестно.' } ] },
  { title:'Объёмные модели', sub:'Те же места, собранные в 3D: можно гулять и смотреть с любой стороны.', link:'modeli.html' },
  { title:'Мастерская материалов', sub:'Хром, мыльная плёнка, жидкий металл и стекло — всё можно трогать.', link:'materialy.html' },
];

/* ===================================================================== */
const V3=THREE.Vector3;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const SN=(()=>{ const p=new Uint8Array(512); let s=1337; const q=[...Array(256).keys()];
  for (let i=255;i>0;i--){ s=(s*16807)%2147483647; const j=s%(i+1); [q[i],q[j]]=[q[j],q[i]]; } for (let i=0;i<512;i++) p[i]=q[i&255];
  const g=(h,x,y)=>((h&1)?-x:x)+((h&2)?-y:y), f=t=>t*t*t*(t*(t*6-15)+10), l=(a,b,t)=>a+t*(b-a);
  return (x,y)=>{ const X=Math.floor(x)&255, Y=Math.floor(y)&255; x-=Math.floor(x); y-=Math.floor(y); const u=f(x), v=f(y), A=p[X]+Y, B=p[X+1]+Y;
    return l(l(g(p[A],x,y),g(p[B],x-1,y),u), l(g(p[A+1],x,y-1),g(p[B+1],x-1,y-1),u), v); }; })();
const hsl=(h,s,l)=>{ h=((h%1)+1)%1; const a=s*Math.min(l,1-l); const f=n=>{const k=(n+h*12)%12; return l-a*Math.max(-1,Math.min(k-3,9-k,1));}; return [f(0),f(8),f(4)]; };

/* ---------- renderer ---------- */
const FAST=/[?&]fast/.test(location.search);
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
const maxPR=FAST?.6:Math.min(window.devicePixelRatio||1, 2); let pr=maxPR;
renderer.setPixelRatio(pr);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const ANISO=renderer.capabilities.getMaxAnisotropy();
const scene=new THREE.Scene();
scene.fog=new THREE.Fog('#eef2f6', 60, 320);
const camera=new THREE.PerspectiveCamera(50, 1, .05, 2000);
const pmrem=new THREE.PMREMGenerator(renderer);
const rt=new THREE.WebGLRenderTarget(16, 16, { type:THREE.HalfFloatType, samples:FAST?0:4 });
const composer=new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new OutputPass());
const grade=new ShaderPass({
  uniforms:{ tDiffuse:{value:null}, time:{value:0}, vig:{value:.3} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float time, vig; varying vec2 vUv;
    void main(){ vec4 c=texture2D(tDiffuse,vUv); vec2 d=vUv-.5; c.rgb*=1.-dot(d,d)*vig;
      float n=fract(sin(dot(vUv*vec2(1271.3,917.7)+fract(time),vec2(12.9898,78.233)))*43758.5453); c.rgb+=(n-.5)*.01; gl_FragColor=c; }` });
composer.addPass(grade);
const sun=new THREE.DirectionalLight('#fff3e2', 1.6); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:200}); sun.position.set(14,30,16); scene.add(sun, sun.target);

/* ---------- текстуры ---------- */
const TL=new THREE.TextureLoader();
const loadTex=(url,srgb=true)=>new Promise(res=>TL.load(url, t=>{ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=ANISO; if (srgb) t.colorSpace=THREE.SRGBColorSpace; t.userData.keep=true; res(t); }, undefined, ()=>res(null)));
let concrete=null, concreteN=null, hubEnv=null, hubBg=null;
const hueTex=(()=>{ const cv=document.createElement('canvas'); cv.width=cv.height=256; const c=cv.getContext('2d'); const img=c.createImageData(256,256);
  for (let y=0;y<256;y++) for (let x=0;x<256;x++){ const n=SN(x/70,y/70)*.7+SN(x/30+9,y/30)*.3; const [r,g,b]=hsl(.6+n*.9,.75,.6); const i=(y*256+x)*4; img.data[i]=r*255; img.data[i+1]=g*255; img.data[i+2]=b*255; img.data[i+3]=255; }
  c.putImageData(img,0,0); const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.userData.keep=true; return t; })();
async function loadHubAssets(){
  const [d,n,bg,hdr]=await Promise.all([ loadTex('assets/tex/brushed_concrete.jpg'), loadTex('assets/tex/brushed_concrete_n.jpg',false), loadTex('assets/sky/kloofendal_overcast.jpg'),
    new Promise(res=>new RGBELoader().setDataType(THREE.FloatType).load('assets/sky/kloofendal_overcast.hdr', res, undefined, ()=>res(null))) ]);
  concrete=d; concreteN=n;
  if (bg){ bg.mapping=THREE.EquirectangularReflectionMapping; hubBg=bg; }
  if (hdr){ hdr.mapping=THREE.EquirectangularReflectionMapping; const D=hdr.image.data; for (let i=0;i<D.length;i++) if ((i&3)!==3&&D[i]>60) D[i]=60; hdr.needsUpdate=true; hubEnv=pmrem.fromEquirectangular(hdr).texture; hdr.dispose(); }
}
// глубина: 16 бит в каналах R и G; читаем и в шейдер, и в JS (для точек обзора)
async function loadDepth(url){
  const t=await loadTex(url,false); if (!t) return null;
  t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; t.minFilter=t.magFilter=THREE.NearestFilter; t.generateMipmaps=false; t.anisotropy=1;
  const img=t.image, cv=document.createElement('canvas'); cv.width=img.width; cv.height=img.height; const c=cv.getContext('2d'); c.drawImage(img,0,0);
  const data=c.getImageData(0,0,img.width,img.height).data;
  t.userData.sample=(u,v)=>{ const x=clamp(Math.round(u*(img.width-1)),0,img.width-1), y=clamp(Math.round((1-v)*(img.height-1)),0,img.height-1), i=(y*img.width+x)*4; return (data[i]*256+data[i+1])/65535; };
  t.userData.w=img.width; t.userData.h=img.height; return t;
}

/* =====================================================================
   ФОТО-ПРОСТРАНСТВО: снимок, поднятый в объём по карте глубины
   ===================================================================== */
const NEAR=3, FAR=140;
const photoVS=`
  uniform sampler2D tD; uniform float near, far, tanV, aspect, push, ext; uniform vec2 texel; varying vec2 vUv; varying float vE; varying float vZ;
  float disp(vec2 uv){ vec3 c=texture2D(tD,uv).rgb; return (c.r*65280.+c.g*255.)/65535.; }
  float Z(vec2 uv){ return 1./(1./far + disp(uv)*(1./near-1./far)); }
  void main(){ vec2 ue=(uv-.5)*(1.+2.*ext)+.5; vUv=clamp(ue,0.,1.); float z=Z(vUv)*push; vZ=z;
    float z1=Z(vUv+vec2(texel.x*2.,0.)), z2=Z(vUv-vec2(texel.x*2.,0.)), z3=Z(vUv+vec2(0.,texel.y*2.)), z4=Z(vUv-vec2(0.,texel.y*2.));
    vE=(max(max(z1,z2),max(z3,z4))-min(min(z1,z2),min(z3,z4)))/min(min(z1,z2),min(z3,z4));
    vec3 p=vec3((ue.x-.5)*2.*tanV*aspect*z, (ue.y-.5)*2.*tanV*z, -z);
    gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.); }`;
const photoFS=`uniform sampler2D tP, tD; uniform float edgeT, near, far, push; varying vec2 vUv; varying float vE; varying float vZ;
  void main(){
    if (edgeT<9.){ vec3 c=texture2D(tD,vUv).rgb; float d=(c.r*65280.+c.g*255.)/65535.; float zf=push/(1./far+d*(1./near-1./far));
      if (abs(vZ-zf)>edgeT*zf) discard; }
    gl_FragColor=texture2D(tP,vUv);
  #include <colorspace_fragment>
  }`;
let G=null, W=null, placeIdx=-1, stopIdx=0;
function photoLayer(tP, tD, tanV, aspect, {seg, push, edgeT, ext=0}){
  const geo=new THREE.PlaneGeometry(1,1,seg,Math.round(seg/aspect)); geo.translate(.5,.5,0);
  const mat=new THREE.ShaderMaterial({ vertexShader:photoVS, fragmentShader:photoFS,
    uniforms:{ tP:{value:tP}, tD:{value:tD}, near:{value:NEAR}, far:{value:FAR}, tanV:{value:tanV}, aspect:{value:aspect}, push:{value:push},
      texel:{value:new THREE.Vector2(1/tD.userData.w,1/tD.userData.h)}, edgeT:{value:edgeT}, ext:{value:ext} } });
  // UV остаются 0..1, вершины считает шейдер
  const m=new THREE.Mesh(geo, mat); m.frustumCulled=false; return m;
}
async function buildPhoto(i){
  const pl=PLACES[i];
  const [tP, tD, tB]=await Promise.all([loadTex(pl.photo), loadDepth(pl.depth), loadDepth(pl.depthBg)]);
  tP.wrapS=tP.wrapT=THREE.ClampToEdgeWrapping;
  const aspect=tP.image.width/tP.image.height, tanV=Math.tan(THREE.MathUtils.degToRad(pl.vfov/2));
  const seg=FAST&&!/hq/.test(location.search)?180:Math.round(tD.userData.w/1.5);
  const bg=photoLayer(tP, tB||tD, tanV, aspect, {seg:Math.round(seg/2), push:1.04, edgeT:99, ext:.1});
  const fg=photoLayer(tP, tD, tanV, aspect, {seg, push:1, edgeT:.09});
  G.add(bg, fg);
  const pointAt=(u,v)=>{ const d=tD.userData.sample(u,v), z=1/(1/FAR+d*(1/NEAR-1/FAR)); return new V3((u-.5)*2*tanV*aspect*z, (v-.5)*2*tanV*z, -z); };
  const baseFov=2*THREE.MathUtils.radToDeg(Math.atan(tanV*.9));
  const stops=pl.stops.map(s=>{
    if (!s.zoom) return { pos:new V3(), look:new V3(0,0,-10), fov:baseFov };
    const P=pointAt(s.u,s.v), dist=P.length(), go=Math.min(dist*.45, NEAR*.5)*s.zoom;
    return { pos:P.clone().normalize().multiplyScalar(go), look:P, fov:baseFov*(1-.5*s.zoom) };
  });
  document.getElementById('bgphoto').style.backgroundImage=`url(${pl.photo})`;
  return { photo:true, aspect, tanV, baseFov, stops };
}

/* ---------- хаб ---------- */
const photoTex={};
function loadPhoto(src){ if (!photoTex[src]){ const t=TL.load(src); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=ANISO; t.userData.keep=true; photoTex[src]=t; } return photoTex[src]; }
const ASPECT=[736/1352, .75,.75,.75,.75,.75, .75, .75];
function labelTex(title, sub){
  const cv=document.createElement('canvas'); cv.width=1024; cv.height=300; const c=cv.getContext('2d');
  c.fillStyle='#17161d'; c.font='700 70px Unbounded, sans-serif'; c.textAlign='center'; c.textBaseline='top'; c.fillText(title,512,30,980);
  c.fillStyle='#4a4856'; c.font='500 36px Manrope, sans-serif';
  const words=sub.split(' '); let line='', y=136; for (const w of words){ const t=line?line+' '+w:w; if (c.measureText(t).width>900){ c.fillText(line,512,y); line=w; y+=46; } else line=t; } c.fillText(line,512,y);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=ANISO; return t;
}
const HUB_R=10, STEP=Math.PI*2/PLACES.length;
let hubSel=0, hubYaw=0;
function buildHub(){
  const floor=new THREE.Mesh(new THREE.CircleGeometry(400,96), new THREE.MeshStandardMaterial({ color:'#e9eaed', map:concrete, normalMap:concreteN, roughness:.35 }));
  if (concrete){ [concrete, concreteN].forEach(t=>t&&t.repeat.set(60,60)); }
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; G.add(floor);
  const colM=new THREE.MeshStandardMaterial({ color:'#f1f2f4', roughness:.85 });
  for (let i=0;i<20;i++){ const a=i/20*Math.PI*2+.08; const m=new THREE.Mesh(new THREE.BoxGeometry(10,320,10), colM); m.position.set(Math.sin(a)*150,160,-Math.cos(a)*150); G.add(m); }
  const frameM=new THREE.MeshStandardMaterial({ color:'#222129', roughness:.35, metalness:.6 });
  const portals=PLACES.map((pl,i)=>{
    const H=4.4, Wd=H*ASPECT[i], g=new THREE.Group(), a=i*STEP;
    const mat=pl.photo ? new THREE.MeshBasicMaterial({ map:loadPhoto(pl.photo) })
      : new THREE.MeshPhysicalMaterial({ map:hueTex, metalness:1, roughness:.1, iridescence:1, iridescenceThicknessRange:[200,800] });
    const photo=new THREE.Mesh(new THREE.PlaneGeometry(Wd,H), mat); photo.position.set(0,H/2+1.15,.06);
    const back=new THREE.Mesh(new THREE.BoxGeometry(Wd+.36,H+.36,.3), frameM); back.position.set(0,H/2+1.15,-.1); back.castShadow=true;
    const label=new THREE.Mesh(new THREE.PlaneGeometry(3.6,1.05), new THREE.MeshBasicMaterial({ map:labelTex(pl.title, pl.sub), transparent:true }));
    label.position.set(0,.42,.5); label.rotation.x=-.35;
    g.add(photo, back, label); g.position.set(Math.sin(a)*HUB_R,0,-Math.cos(a)*HUB_R); g.lookAt(0,0,0);
    [photo,back,label].forEach(m=>m.userData.portal=i); G.add(g); return { g };
  });
  return { hub:true, portals, pick:portals.flatMap(p=>p.g.children),
    update(dt,t){ portals.forEach((p,i)=>{ const s=p.g.scale.x+((i===hubSel?1.06:1)-p.g.scale.x)*Math.min(1,dt*6); p.g.scale.setScalar(s); }); hueTex.offset.x=(t*.03)%1; } };
}

/* =====================================================================
   ЗАГРУЗКА, КАМЕРА
   ===================================================================== */
const clock=new THREE.Clock();
const camPos=new V3(), camLook=new V3(0,0,-10); let camFov=50, fly=null, offX=0, offY=0, lookX=0, lookY=0, tapZoom=null;
function disposeWorld(){
  if (!G) return;
  G.traverse(o=>{ if (o.geometry) o.geometry.dispose(); if (o.material){ for (const k in o.material){ const v=o.material[k]; if (v&&v.isTexture&&!v.userData.keep) v.dispose(); }
    const u=o.material.uniforms; if (u) for (const k in u){ const v=u[k].value; if (v&&v.isTexture) v.dispose(); } o.material.dispose(); } });
  scene.remove(G); G=null;
}
function layout(){
  const photo=W&&W.photo;
  document.body.classList.toggle('photo', !!photo);
  let w=innerWidth, h=innerHeight;
  if (photo){
    const m=Math.max(16, Math.min(innerWidth,innerHeight)*.035), landscape=innerWidth/innerHeight>1;
    if (landscape){ h=innerHeight-2*m; w=h*W.aspect; const maxW=innerWidth*.56; if (w>maxW){ w=maxW; h=w/W.aspect; } }
    else { w=innerWidth-2*m; h=w/W.aspect; const maxH=innerHeight*.58; if (h>maxH){ h=maxH; w=h*W.aspect; } }
  }
  renderer.setPixelRatio(pr); renderer.setSize(Math.round(w), Math.round(h));
  composer.setPixelRatio(pr); composer.setSize(Math.round(w), Math.round(h));
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
async function loadPlace(i){
  disposeWorld(); G=new THREE.Group(); scene.add(G); placeIdx=i;
  if (i<0){
    W=buildHub(); scene.background=hubBg; scene.environment=hubEnv; scene.fog.near=60; scene.fog.far=320;
    renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05; grade.uniforms.vig.value=.35;
    hubYaw=hubSel*STEP; camera.fov=50;
  } else {
    W=await buildPhoto(i); scene.background=new THREE.Color('#000'); scene.environment=null; scene.fog.near=1e5; scene.fog.far=1e6;
    renderer.toneMapping=THREE.NoToneMapping; grade.uniforms.vig.value=.18;
    stopIdx=0; offX=offY=lookX=lookY=0; tapZoom=null;
    const s=W.stops[0]; camPos.set(0,0,-NEAR*.0); camLook.copy(s.look); camFov=s.fov*1.25; fly=null; goStop(0,true); fly.dur=FAST?.01:2.4;
  }
  layout(); renderer.compile(scene,camera);
}
function goStop(i, force=false){
  if (!W||W.hub) return; i=clamp(i,0,W.stops.length-1); if (i===stopIdx&&!force) return;
  stopIdx=i; tapZoom=null; const s=W.stops[i];
  fly={ fromPos:camPos.clone(), fromLook:camLook.clone(), fromFov:camFov, toPos:s.pos.clone(), toLook:s.look.clone(), toFov:s.fov, t:0, dur:FAST?.01:2.2 };
  renderUI();
}
const tmpV=new V3(), fwd=new V3();
let dragging=false;
const nearestYaw=(target,cur)=>{ const TAU=Math.PI*2; return cur+((((target-cur)%TAU)+TAU+Math.PI)%TAU-Math.PI); };
function updateCamera(dt,t){
  if (W.hub){
    if (!dragging) hubYaw+=(nearestYaw(hubSel*STEP,hubYaw)-hubYaw)*Math.min(1,dt*5);
    camera.position.set(Math.sin(t*.25)*.08, 2.2+Math.sin(t*.4)*.05, 0);
    fwd.set(Math.sin(hubYaw),-.02,-Math.cos(hubYaw)); camera.lookAt(tmpV.copy(camera.position).add(fwd));
    if (Math.abs(camera.fov-50)>.01){ camera.fov=50; camera.updateProjectionMatrix(); }
    const w=innerWidth, h=innerHeight, k=card.classList.contains('out')?0:1; shiftK+=(k-shiftK)*Math.min(1,dt*3);
    if (w/h>1) camera.setViewOffset(w,h,-w*.14*shiftK,0,w,h); else camera.setViewOffset(w,h,0,h*.16*shiftK,w,h);
    return;
  }
  camera.clearViewOffset();
  if (fly){ fly.t+=dt/fly.dur; const k=easeIO(Math.min(fly.t,1));
    camPos.lerpVectors(fly.fromPos,fly.toPos,k); camLook.lerpVectors(fly.fromLook,fly.toLook,k); camFov=fly.fromFov+(fly.toFov-fly.fromFov)*k;
    if (fly.t>=1) fly=null; }
  // плавное «дыхание» камеры и смещение пальцем — показывает объём
  const sway=NEAR*.05, ox=Math.sin(t*.33)*sway+offX*NEAR*.09, oy=Math.sin(t*.27)*sway*.5+offY*NEAR*.05;
  let look=camLook, fov=camFov;
  if (tapZoom){ tapZoom.k=Math.min(1,tapZoom.k+dt*1.2); const e=easeIO(tapZoom.k); look=tmpV.lerpVectors(camLook,tapZoom.look,e).clone(); fov=camFov+(camFov*.55-camFov)*e; }
  camera.position.set(camPos.x+ox, camPos.y+oy, camPos.z);
  // не даём кадру выйти за края снимка
  const d=tmpV.set(look.x+lookX*look.length()*.08-camera.position.x, look.y+lookY*look.length()*.05-camera.position.y, look.z-camera.position.z);
  const th=Math.tan(THREE.MathUtils.degToRad(fov/2)), limY=Math.max(0,W.tanV*.975-th), limX=Math.max(0,W.tanV*W.aspect*.975-th*W.aspect);
  const tx=clamp(d.x/-d.z,-limX,limX), ty=clamp(d.y/-d.z,-limY,limY);
  camera.lookAt(camera.position.x+tx, camera.position.y+ty, camera.position.z-1);
  if (Math.abs(camera.fov-fov)>.001){ camera.fov=fov; camera.updateProjectionMatrix(); }
}
let shiftK=0;

/* =====================================================================
   ИНТЕРФЕЙС
   ===================================================================== */
const $=id=>document.getElementById(id);
const card=$('card'), dotsEl=$('dots'); let cardTimer=0;
function setDots(n,on,onClick){
  if (dotsEl.children.length!==n){ dotsEl.innerHTML=''; for (let i=0;i<n;i++){ const b=document.createElement('button'); b.className='dot'; b.innerHTML='<i></i>'; dotsEl.appendChild(b); } }
  [...dotsEl.children].forEach((d,i)=>{ d.classList.toggle('on',i===on); d.onclick=()=>onClick(i); });
}
function renderUI(){
  card.classList.add('out'); clearTimeout(cardTimer);
  const hub=W&&W.hub; $('home').hidden=hub; $('thumb').hidden=true;
  if (hub){ setDots(PLACES.length,hubSel,i=>{ hubSel=i; renderUI(); }); $('prev').disabled=false; $('next').disabled=false; }
  else { setDots(W.stops.length,stopIdx,i=>goStop(i)); $('prev').disabled=stopIdx===0; $('next').disabled=false; }
  cardTimer=setTimeout(()=>{
    if (hub){ const pl=PLACES[hubSel]; $('num').textContent=`Место ${hubSel+1} из ${PLACES.length}`; $('title').textContent=pl.title; $('text').textContent=pl.sub;
      $('action').hidden=false; $('action').textContent='Войти →'; }
    else { const pl=PLACES[placeIdx], s=pl.stops[stopIdx]; $('num').textContent=`${pl.title} · ${stopIdx+1} / ${W.stops.length}`;
      $('title').textContent=s.title; $('text').textContent=s.text; const last=stopIdx===W.stops.length-1; $('action').hidden=!last; $('action').textContent='Вернуться в хаб'; }
    card.classList.remove('out');
  }, 380);
}
function fade(on){ return new Promise(r=>{ $('fade').style.opacity=on?1:0; setTimeout(r,620); }); }
let busy=false;
async function enterPlace(i){
  if (busy) return; const pl=PLACES[i];
  if (pl.link){ busy=true; await fade(true); location.href=pl.link; return; }
  busy=true; $('fadeMsg').textContent=pl.title; await fade(true);
  await loadPlace(i); renderUI(); await fade(false); busy=false;
  showHint('Ведите пальцем — увидите объём · коснитесь, чтобы приблизить');
}
async function toHub(){ if (busy) return; busy=true; $('fadeMsg').textContent='Хаб'; await fade(true); await loadPlace(-1); renderUI(); await fade(false); busy=false; }
$('prev').onclick=()=>{ if (W.hub){ hubSel=(hubSel-1+PLACES.length)%PLACES.length; renderUI(); } else goStop(stopIdx-1); };
$('next').onclick=()=>{ if (W.hub){ hubSel=(hubSel+1)%PLACES.length; renderUI(); } else if (stopIdx===W.stops.length-1) toHub(); else goStop(stopIdx+1); };
$('action').onclick=()=>{ if (W.hub) enterPlace(hubSel); else toHub(); };
$('home').onclick=toHub;
$('fs').onclick=()=>{ const d=document, e=d.documentElement; if (!d.fullscreenElement) (e.requestFullscreen||e.webkitRequestFullscreen||(()=>{})).call(e); else d.exitFullscreen(); };
addEventListener('keydown', e=>{ if (e.key==='ArrowRight'||e.key===' ') $('next').click(); if (e.key==='ArrowLeft') $('prev').click(); if (e.key==='Enter'&&W.hub) enterPlace(hubSel); if (e.key==='Escape'&&!W.hub) toHub(); });
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('gesturestart', e=>e.preventDefault());
let hintT=0; function showHint(txt){ const h=$('hint'); h.textContent=txt; h.classList.remove('off'); clearTimeout(hintT); hintT=setTimeout(()=>h.classList.add('off'),6000); }

/* ---------- касания ---------- */
const raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2();
const toNdc=(x,y)=>{ const r=canvas.getBoundingClientRect(); return ndc.set((x-r.left)/r.width*2-1, -((y-r.top)/r.height)*2+1); };
const pointers=new Map();
const surface=document.body;
surface.addEventListener('pointerdown', e=>{
  if (e.target.closest('button,.card,.nav,.tl,.tr')) return;
  pointers.set(e.pointerId,{x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t0:performance.now(),moved:false});
  $('hint').classList.add('off');
});
surface.addEventListener('pointermove', e=>{
  const p=pointers.get(e.pointerId); if (!p) return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if (Math.hypot(p.x-p.x0,p.y-p.y0)>12) p.moved=true; if (!p.moved) return;
  dragging=true;
  if (W.hub) hubYaw-=dx*.004;
  else { offX=clamp(offX-dx*.004,-1,1); offY=clamp(offY+dy*.004,-1,1); lookX=clamp(lookX+dx*.0015,-1,1); lookY=clamp(lookY-dy*.0015,-1,1); }
});
function endPointer(e){
  const p=pointers.get(e.pointerId); if (!p) return; pointers.delete(e.pointerId);
  const dt=performance.now()-p.t0, dx=p.x-p.x0, dy=p.y-p.y0;
  if (W.hub&&dragging&&pointers.size===0){
    const k=Math.round(hubYaw/STEP); let sel=((k%PLACES.length)+PLACES.length)%PLACES.length;
    if (dt<450&&Math.abs(dx)>80&&sel===hubSel) sel=(hubSel+(dx<0?1:-1)+PLACES.length)%PLACES.length;
    if (sel!==hubSel){ hubSel=sel; renderUI(); }
  } else if (!W.hub&&dragging&&dt<380&&Math.abs(dx)>160&&Math.abs(dx)>2*Math.abs(dy)){ if (dx<0) $('next').click(); else goStop(stopIdx-1); }
  if (pointers.size===0) dragging=false;
  if (!p.moved&&dt<500&&!busy) tap(p.x,p.y);
}
surface.addEventListener('pointerup', endPointer);
surface.addEventListener('pointercancel', endPointer);
function tap(x,y){
  if (W.hub){ toNdc(x,y); raycaster.setFromCamera(ndc,camera); const h=raycaster.intersectObjects(W.pick,false)[0]; if (!h) return;
    const i=h.object.userData.portal; if (i===hubSel) enterPlace(i); else { hubSel=i; renderUI(); } return; }
  const r=canvas.getBoundingClientRect(); if (x<r.left||x>r.right||y<r.top||y>r.bottom) return;
  if (tapZoom){ tapZoom=null; return; }
  toNdc(x,y); raycaster.setFromCamera(ndc,camera);
  tapZoom={ look:camera.position.clone().addScaledVector(raycaster.ray.direction, camLook.length()), k:0 };
}

/* ---------- размер и автокачество ---------- */
addEventListener('resize', layout);
let fpsN=0, fpsT=0;
function adapt(dt){ if (FAST) return; fpsN++; fpsT+=dt; if (fpsT<2) return; const fps=fpsN/fpsT; fpsN=0; fpsT=0;
  if (fps<34&&pr>.75){ pr=Math.max(.75,pr-.25); layout(); } else if (fps>57&&pr<maxPR){ pr=Math.min(maxPR,pr+.1); layout(); } }

/* ---------- старт ---------- */
await Promise.race([ Promise.all([document.fonts.load('700 70px Unbounded'), document.fonts.load('500 36px Manrope')]).catch(()=>{}), new Promise(r=>setTimeout(r,2500)) ]);
await loadHubAssets();
await loadPlace(-1); renderUI();
window.__state=()=>({ place:placeIdx, stop:stopIdx, flying:!!fly, busy, pr });
window.__go=i=>enterPlace(i); window.__stop=i=>goStop(i);
window.__off=(x,y)=>{ offX=x; offY=y; lookX=-x*.5; lookY=-y*.5; };
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),1/20), t=clock.elapsedTime; if (!W) return;
  W.update&&W.update(dt,t);
  if (!dragging){ offX*=1-Math.min(1,dt*.4); offY*=1-Math.min(1,dt*.4); lookX*=1-Math.min(1,dt*.4); lookY*=1-Math.min(1,dt*.4); }
  updateCamera(dt,t); adapt(dt); grade.uniforms.time.value=t; composer.render();
});
setTimeout(()=>{ fade(false); showHint('Листайте места свайпом · коснитесь фото, чтобы войти'); }, 200);
</script>
</body>
</html>
